// ReRootMod - ModuleManager patch
// Injects ReRootPartModule into all real parts so they expose the "Set as root" context-menu action.
// Excludes EVA Kerbals and asteroids/comets (never valid roots, avoids needless module instances).
@PART[*]:HAS[!MODULE[KerbalEVA],!MODULE[ModuleAsteroid],!MODULE[ModuleComet]]:FINAL
{
    MODULE
    {
        name = ReRootPartModule
    }
}
